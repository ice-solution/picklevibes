<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-HK">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>選拔通知</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#fdf2f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <div style="display:none;font-size:1px;color:#fdf2f8;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">
    感謝登記！您已報名 Div B 選拔，時間 11:00–13:00，請準時到場。
  </div>

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#fdf2f8;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:100%;max-width:600px;background-color:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 4px 24px rgba(15,23,42,0.08);">
          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(135deg,#ec4899 0%,#14b8a6 100%);padding:28px 32px;text-align:center;">
              <p style="margin:0;font-size:22px;font-weight:800;color:#ffffff;letter-spacing:-0.02em;">PickleVibes</p>
              <p style="margin:8px 0 0;font-size:13px;color:rgba(255,255,255,0.92);">選拔通知</p>
            </td>
          </tr>

          <!-- Greeting -->
          <tr>
            <td style="padding:28px 32px 8px;">
              <h1 style="margin:0;font-size:22px;line-height:1.35;color:#0f172a;font-weight:700;">感謝您的登記！</h1>
              <p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:#334155;">
                您好{{NAME}}，我們已收到您的選拔報名，詳情如下：
              </p>
            </td>
          </tr>

          <!-- Registration details -->
          <tr>
            <td style="padding:16px 32px 8px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#fdf2f8;border-radius:10px;border:1px solid #fbcfe8;">
                <tr>
                  <td style="padding:20px 24px;">
                    <p style="margin:0 0 12px;font-size:13px;font-weight:700;color:#db2777;text-transform:uppercase;letter-spacing:0.04em;">報名資料</p>
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                      <tr>
                        <td style="padding:6px 0;font-size:15px;color:#64748b;width:110px;vertical-align:top;">登記項目</td>
                        <td style="padding:6px 0;font-size:15px;color:#0f172a;font-weight:700;">Div B</td>
                      </tr>
                      <tr>
                        <td style="padding:6px 0;font-size:15px;color:#64748b;vertical-align:top;">選拔時間</td>
                        <td style="padding:6px 0;font-size:15px;color:#0f172a;font-weight:700;">11:00 – 13:00</td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Reminders -->
          <tr>
            <td style="padding:20px 32px 8px;">
              <p style="margin:0 0 12px;font-size:16px;font-weight:700;color:#0f172a;">到場提示</p>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td style="padding:0 0 10px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                      <tr>
                        <td width="28" valign="top" style="font-size:18px;line-height:1.4;">💧</td>
                        <td style="font-size:15px;line-height:1.55;color:#334155;">請自備足夠<strong>水飲</strong>，保持身體水分。</td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="padding:0 0 10px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                      <tr>
                        <td width="28" valign="top" style="font-size:18px;line-height:1.4;">⏰</td>
                        <td style="font-size:15px;line-height:1.55;color:#334155;">請<strong>準時到場</strong>，建議提早 10–15 分鐘到達。</td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="padding:0;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                      <tr>
                        <td width="28" valign="top" style="font-size:18px;line-height:1.4;">👟</td>
                        <td style="font-size:15px;line-height:1.55;color:#334155;"><strong>請勿穿著黑色鞋底的鞋子</strong>，以免損耗場地。</td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Closing -->
          <tr>
            <td style="padding:20px 32px 28px;">
              <p style="margin:0;font-size:15px;line-height:1.65;color:#334155;">
                期待與您見面！如有任何問題，歡迎回覆此電郵或透過網站聯絡我們。
              </p>
              <p style="margin:16px 0 0;font-size:15px;color:#0f172a;font-weight:600;">
                PickleVibes 團隊
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px 32px;background-color:#fdf2f8;border-top:1px solid #fbcfe8;">
              <p style="margin:0;font-size:12px;line-height:1.5;color:#64748b;">
                此郵件由系統發出。如需協助請透過網站聯絡我們。
              </p>
              <p style="margin:8px 0 0;font-size:12px;color:#94a3b8;">
                © PickleVibes
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
